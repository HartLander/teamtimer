services:
  teamtimer:
    build: .
    container_name: teamtimer
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${DATA_DIR_HOST:-./data}:${DATA_DIR_CONTAINER:-/app/data}
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: ${DATA_DIR_CONTAINER:-/app/data}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-teamtimer-dev-secret-change-me}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    restart: unless-stopped
